type ExecutionCoverage {
  "Trades with both same-block oracle prices, before sign filtering. Unit: count. Null if unavailable; canonical decimal string."
  measuredTrades: DecimalValue

  "Trades missing either same-block oracle price, before sign filtering. Unit: count. Null if unavailable; canonical decimal string."
  unmeasuredTrades: DecimalValue

  """
  Volume of measured trades before sign filtering, in the selected currency.
  """
  measuredVolume(
    """
    RUNE is measured; USD is indicative at the current RUNE/USD price, including historical values.
    """
    currency: ThorchainCurrency = RUNE
  ): DecimalValue

  """
  Volume of unmeasured trades before sign filtering, in the selected currency.
  """
  unmeasuredVolume(
    """
    RUNE is measured; USD is indicative at the current RUNE/USD price, including historical values.
    """
    currency: ThorchainCurrency = RUNE
  ): DecimalValue

  "Measured trades \/ total trades before sign filtering; 0.25 means 25%. Null if no trades. Unit: ratio. Null if unavailable; canonical decimal string."
  share: DecimalValue
}

type StakingCurrent {
  """
  Yielding-mode annualized return without compounding at the current snapshot. Unit: ratio. Null if unavailable; canonical decimal string.
  """
  apr(
    """
    Return the equal-weight mean of each completed UTC day's value over this range instead of the current snapshot. Null if any day in the range has no value. Edges must fall on UTC midnight; the open day never counts.
    """
    averageOver: TimeRangeInput
  ): DecimalValue
  """
  Auto-compounding-mode annualized yield including compounding at the current snapshot. Unit: ratio. Null if unavailable; canonical decimal string.
  """
  apy(
    """
    Return the equal-weight mean of each completed UTC day's value over this range instead of the current snapshot. Null if any day in the range has no value. Edges must fall on UTC midnight; the open day never counts.
    """
    averageOver: TimeRangeInput
  ): DecimalValue
  """
  UTC measurement time of this snapshot. Unit: timestamp. UTC ISO8601 timestamp.
  """
  asOf: Timestamp!
  """
  Revenue the token's distributor holds for its staking pool at the latest snapshot, not yet paid. Only BRUNE has a value. Applies to RUJI in USDC or USD, and to BRUNE and TCY in RUNE or USD; USD is the default for all three. A currency the selected token does not pay in is inapplicable and reads null. Unit: selected_currency. Null if unavailable; canonical decimal string.
  """
  pendingRewards(
    """Selects the currency variant. Null if that combination is unavailable."""
    currency: StakingRevenueCurrency = USD
  ): DecimalValue
  """
  Latest amount staked in the selected pool, in tokens or USD; combined or by staking mode.
  """
  staked(
    unit: StakedValueUnit = STAKED_TOKEN
    """Select yielding, auto-compounding, or both combined (TOTAL)."""
    mode: StakingModeFilter = TOTAL
  ): DecimalValue
}

type TradePoint {
  "UTC period close (last millisecond) for complete and unfinished points; range end (last millisecond) for range-clipped points."
  timestamp: Timestamp!

  "True only for a fully included, ended calendar period; false for unfinished or range-clipped periods. Data may still be corrected."
  isComplete: Boolean!

  """
  TOTAL: all Rujira Trade volume; NON_VS_VOLUME: without VS; VS_VOLUME: VS portion counted at 50% of notional value to avoid double counting.
  """
  volume(source: TradeVolumeSource = TOTAL, transform: MetricTransformInput): DecimalValue

  "THORChain volume for FIN-listed markets, including non-VS activity. Unit: usd. Null if unavailable; canonical decimal string."
  thorchainVolume(
    "Declared: sma, growth. GROWTH with ABSOLUTE returns a change in this field's unit; GROWTH with RELATIVE returns a unitless ratio of that change to the baseline bin, null when the baseline is zero or unknown."
    transform: MetricTransformInput
  ): DecimalValue

  "Fees paid by the VS to THORChain during this chart period, in USD. Unit: usd. Null if unavailable; canonical decimal string."
  vsFeesToThorchain(
    "Declared: sma, growth. GROWTH with ABSOLUTE returns a change in this field's unit; GROWTH with RELATIVE returns a unitless ratio of that change to the baseline bin, null when the baseline is zero or unknown."
    transform: MetricTransformInput
  ): DecimalValue

  "THORChain's revenue-collector share: THEORETICAL is the target after accounting for VS fees already paid; ACTUAL is THORChain's share of what the fee collector sent to the two revenue converters. Unit: ratio. Null if unavailable; canonical decimal string."
  thorchainRevenueShare(
    "Selects the basis variant; required, as this metric has no default. Null if that combination is unavailable."
    basis: RevenueShareBasis!

    "Declared: sma, growth. GROWTH with ABSOLUTE returns a change in this field's unit; GROWTH with RELATIVE returns a unitless ratio of that change to the baseline bin, null when the baseline is zero or unknown."
    transform: MetricTransformInput
  ): DecimalValue

  "VS swap notional (twice its trade volume) as a share of the charted THORChain volume for FIN-listed markets during this chart period. Global only: VS volume has no per-pair breakdown, so under a pair it reads 0 with a scope_unsupported error. Unit: ratio. Null if unavailable; canonical decimal string."
  vsThorchainVolumeShare(
    "Declared: sma, growth. GROWTH with ABSOLUTE returns a change in this field's unit; GROWTH with RELATIVE returns a unitless ratio of that change to the baseline bin, null when the baseline is zero or unknown."
    transform: MetricTransformInput
  ): DecimalValue

  """Trade revenue by recipient and nature."""
  revenue(recipient: TradeRevenueRecipient = TOTAL, nature: TradeRevenueNature = TOTAL, transform: MetricTransformInput): DecimalValue

  """
  Trade revenue of the selected nature relative to trading volume during this chart period, in basis points.
  """
  revenuePerVolume(nature: TradeRevenueNature = TOTAL, transform: MetricTransformInput): DecimalValue

  """
  Combined AMM TVL from the selected sources for the queried markets at timestamp, in USD.
  """
  ammTvl(
    """
    Omitted/null uses default; [] selects none; duplicates count once. BRUNE is bRUNE/RUNE liquidity on FIN provided by the bRUNE contract, excluding bonded RUNE.
    """
    sources: [AmmTvlSource!] = [CCL, DCL]
    transform: MetricTransformInput
  ): DecimalValue

  "Trading volume relative to AMM TVL for the queried markets during this chart period. Unit: ratio. Null if unavailable; canonical decimal string."
  liquidityUtilization(
    "Declared: sma, growth. GROWTH with ABSOLUTE returns a change in this field's unit; GROWTH with RELATIVE returns a unitless ratio of that change to the baseline bin, null when the baseline is zero or unknown."
    transform: MetricTransformInput
  ): DecimalValue

  "Protocol revenue, including the VS AMM fee, generated per $100 of AMM TVL during this chart period. Unit: usd_per_100_usd_tvl. Null if unavailable; canonical decimal string."
  protocolRevenuePer100Tvl(
    "Declared: sma, growth. GROWTH with ABSOLUTE returns a change in this field's unit; GROWTH with RELATIVE returns a unitless ratio of that change to the baseline bin, null when the baseline is zero or unknown."
    transform: MetricTransformInput
  ): DecimalValue

  "Number of Trade transactions during this chart period. Unit: count. Null if unavailable; canonical decimal string."
  transactions(
    "Declared: sma, growth. GROWTH with ABSOLUTE returns a change in this field's unit; GROWTH with RELATIVE returns a unitless ratio of that change to the baseline bin, null when the baseline is zero or unknown."
    transform: MetricTransformInput
  ): DecimalValue
}

