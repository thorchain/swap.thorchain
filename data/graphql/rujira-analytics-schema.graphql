type VsPoint {
  "UTC period close (last millisecond) for complete and unfinished points; range end (last millisecond) for range-clipped points."
  timestamp: Timestamp!

  "True only for a fully included, ended calendar period; false for unfinished or range-clipped periods. Data may still be corrected."
  isComplete: Boolean!

  "Trading volume generated by VS during this chart period, in USD. Unit: usd. Null if unavailable; canonical decimal string."
  volume(
    "Omitted\/null uses the inherited strategy pair, or all pairs. Explicit IDs replace it; [] selects none; duplicates count once."
    pairIds: [ID!]

    "Declared: sma, growth. GROWTH with ABSOLUTE returns a change in this field's unit; GROWTH with RELATIVE returns a unitless ratio of that change to the baseline bin, null when the baseline is zero or unknown."
    transform: MetricTransformInput
  ): DecimalValue

  "Revenue generated for THORChain by VS during this chart period, in USD. Unit: usd. Null if unavailable; canonical decimal string."
  revenueToThorchain(
    "Omitted\/null uses the inherited strategy pair, or all pairs. Explicit IDs replace it; [] selects none; duplicates count once."
    pairIds: [ID!]

    "Declared: sma, growth. GROWTH with ABSOLUTE returns a change in this field's unit; GROWTH with RELATIVE returns a unitless ratio of that change to the baseline bin, null when the baseline is zero or unknown."
    transform: MetricTransformInput
  ): DecimalValue

  "Protocol fees VS paid the fee collector during this chart period, in USD; unpriced denominations count as zero. Unit: usd. Null if unavailable; canonical decimal string."
  protocolFees(
    "Omitted\/null uses the inherited strategy pair, or all pairs. Explicit IDs replace it; [] selects none; duplicates count once."
    pairIds: [ID!]

    "Declared: sma, growth. GROWTH with ABSOLUTE returns a change in this field's unit; GROWTH with RELATIVE returns a unitless ratio of that change to the baseline bin, null when the baseline is zero or unknown."
    transform: MetricTransformInput
  ): DecimalValue

  "Number of trades executed through VS during this chart period. Unit: count. Null if unavailable; canonical decimal string."
  trades(
    "Omitted\/null uses the inherited strategy pair, or all pairs. Explicit IDs replace it; [] selects none; duplicates count once."
    pairIds: [ID!]

    "Declared: sma, growth. GROWTH with ABSOLUTE returns a change in this field's unit; GROWTH with RELATIVE returns a unitless ratio of that change to the baseline bin, null when the baseline is zero or unknown."
    transform: MetricTransformInput
  ): DecimalValue

  """
  Selected VS asset or debt balance at chart period end, in USD; latest available balance if unfinished.
  """
  assetValue(
    """
    Underlying VS token positions, independent of pair. Omitted/null selects all tokens; [] selects none; duplicates count once.
    """
    tokenIds: [ID!]
    component: VsAssetComponent = NET
    transform: MetricTransformInput
  ): DecimalValue

  """
  Signed gross trading profit/loss during this chart period, excluding borrowing interest. USD uses trade-time prices; RATIO weights individual trade returns by borrowed USD value.
  """
  grossTradingPnl(
    """
    Omitted/null uses the inherited strategy pair, or all pairs. Explicit IDs replace it; [] selects none; duplicates count once.
    """
    pairIds: [ID!]
    unit: PnlUnit = USD
    transform: MetricTransformInput
  ): DecimalValue

  """
  Selected P&L component accumulated since VS inception through this point, attributed to the borrowed/repayment token. The range selects displayed points only; USD uses event-time prices.
  """
  cumulativePnl(
    """
    Borrowed/repayment token IDs, independent of pair. Omitted/null selects all tokens; [] selects none; duplicates count once.
    """
    tokenIds: [ID!]
    """
    GROSS excludes borrowing interest. INTEREST is paid interest as a negative contribution; NET combines both.
    """
    component: VsPnlComponent = NET
    """
    USD uses token prices when profits or interest occurred. TOKEN requires exactly one distinct token ID.
    """
    unit: VsPnlAmountUnit = USD
    """
    Transforms may use cumulative history before the selected range; insufficient lookback returns null.
    """
    transform: MetricTransformInput
  ): DecimalValue
}

