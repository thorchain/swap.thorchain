"Series transform request. SMA takes either periods or a window; GROWTH requires a window and a growthKind and rejects periods. A window must convert to a whole number of bins at the requested resolution — it is never rounded, so an hour or day window at a monthly resolution, a month window at a fixed-width one, or an inexact division is rejected. Everything else is rejected as unsupported input rather than silently folded as SMA."
