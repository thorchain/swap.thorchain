  """
  LENDING_APR/BORROWING_APR sorting only. Omitted/null = current rates; a range uses the same daily average as apr(averageOver).
  """
  averageOver: TimeRangeInput
  direction: SortDirection!
  field: MoneyMarketSortField!
  """
  REVENUE sorting only; omitted/null uses 30d. Omit for other sort fields.
  """
  range: TimeRangeInput
}

enum MoneyMarketSortField {
  TOKEN
  LENDING_TVL
  BORROWING_TVL
  UTILIZATION
  BORROW_CAP
  LENDING_APR
  BORROWING_APR
  REVENUE
}

"""One page of Money Market rows."""
type MoneyMarketTable {
  """Shared UTC snapshot time for current market-row values."""
  asOf: Timestamp!
  """Market rows on this page."""
  nodes: [MoneyMarket!]!
  """Cursor for the next page and whether more rows are available."""
  pageInfo: PageInfo!
}

"""
One lending market (Ghost vault) per underlying token; stable market ID.
"""
type MoneyMarket {
  """
  Current net lender-return or positive borrowing-cost APR; averageOver selects the existing historical daily average. Preserve known 0%. A market with zero debt can still have a configured nonzero borrowing rate.
  """
  apr(
    side: MoneyMarketSide!
    """
    Omitted/null = current rate; otherwise a historical daily rate average. Supports 1d, 7d, 30d and allTime; see rateAverages.
    """
    averageOver: TimeRangeInput
  ): DecimalValue
  """
  Credit-account controller's configured debt limit for this market; other direct borrowers have separate limits. TOKEN uses the underlying token; USD its current price. Null when the credit-account controller is not an approved borrower.
  """
  borrowCap(unit: MoneyMarketValueUnit = USD): DecimalValue
  """Stable lending-market identifier."""
  id: ID!
  """Receipt-distribution revenue for this market over the selected range."""
  revenue(
    """
    Omitted/null selects the last 30 days; custom dates and allTime are supported.
    """
    range: TimeRangeInput = {trailing: {value: 30, unit: DAY}}
    recipient: MoneyMarketRevenueRecipient = TOTAL
  ): DecimalValue
  """Underlying supplied/borrowed token; its ID filters the analytics page."""
  token: Token!
  """
  Current market supply or outstanding debt, including accrued interest. BORROWING combines Ghost Credit, the VS and every other approved borrower; it is not Ghost Credit-only debt.
  """
  tvl(
    """
    LENDING selects total supplied funds; BORROWING selects all outstanding debt.
    """
    side: MoneyMarketSide!
    """
    USD uses the underlying token's current USD display price; TOKEN is an unscaled amount of that token, using its bank-token decimals.
    """
    unit: MoneyMarketValueUnit = USD
  ): DecimalValue
  """
  Current borrowed share of supplied value; includes all approved borrowers. Unit: ratio.
  """
  utilization: DecimalValue

  """
  Whether Ghost Credit is registered as an approved borrower in this lending vault. True even when its limit or available amount is zero; VS-only approval is false. Null when approval cannot be determined.
  """
  ghostCreditSupported: Boolean

  """
  Current debt and available borrowing through Ghost Credit in this vault, across all Ghost Credit users. Excludes VS/other-borrower debt. Null when Ghost Credit is not approved or its state is unavailable; inspect ghostCreditSupported to distinguish known non-approval.
  """
  ghostCredit: MoneyMarketGhostCreditState

  """
  Current utilization-based borrowing-rate parameters for this vault, shared by Ghost Credit, the VS and other approved borrowers. These are decimal ratios, not Main API scaled integers.
  """
  interestCurve: MoneyMarketInterestCurve

  """
  Current protocol fraction of accrued borrowing interest. Lender APR = borrowing APR * utilization * (1 - protocolFeeRate); do not deduct this fee again from the returned lending APR.
  """
  protocolFeeRate: DecimalValue
}

enum MoneyMarketValueUnit {
  USD
  TOKEN
}

"""Money Market interest and revenue over the selected range."""
type MoneyMarketSummary {
  """Interest accrued over the selected range, by allocation. Unit: usd."""
  interest(allocation: MoneyMarketInterestAllocation = TOTAL): DecimalValue
  """
  Receipt-distribution revenue over the selected range; TOTAL = RUJIRA + THORCHAIN. Unit: usd.
  """
  revenue(recipient: MoneyMarketRevenueRecipient = TOTAL): DecimalValue
}

enum PositionWaterfallBreakdownKind {
  REALIZED
  UNREALIZED
  PRINCIPAL
  PROFIT
}

enum RevenuePer100TvlSource {
  THORCHAIN_BASE_LAYER
  RUJIRA_FIN
}

enum PositionStatus {
  OPEN
  CLOSED
}

enum PositionStatusFilter {
  OPEN
  CLOSED
  ALL
}

"""
Current debt-USD-weighted borrowing cost, separate from positive-yield weightedApr.

Use current outstanding debt including accrued interest across all markets. Map credit accounts to owners; direct borrowers use their address. Include VS/protocol actors; no $1 threshold. Weight current market borrowing APRs by debt USD value; include known 0%, exclude unavailable rates and report their debt value.
"""
type AccountWeightedBorrowingApr {
  """
  Positive annualized borrowing cost; null if no positive debt has an available rate. Never netted against weightedApr.
  """
  apr: DecimalValue
  """Current debt value with an available borrowing APR; zero if none."""
  includedDebtUsd: DecimalValue!
  """
  Current debt value excluded because its borrowing APR is unavailable; zero if none.
  """
  excludedDebtUsd: DecimalValue!
}

"""
Total RUNE rewards held in the bRUNE contract awaiting distribution or compounding, before protocol fees; no mode breakdown.
"""
type BruneStakingPoint {
  """
  UTC period close (last millisecond) for complete points; last included measurement time for unfinished or range-clipped points.
  """
  timestamp: Timestamp!
  """
  True only for a fully included, ended calendar period; false for unfinished or range-clipped periods. Data may still be corrected.
  """
  isComplete: Boolean!
  """
  Total pending RUNE rewards at timestamp, before protocol fees, in the selected currency.
  """
  pendingRewards(
    """
    USD uses the RUNE/USD price at this point's timestamp, before applying any transform.
    """
    currency: StakingRevenueCurrency = RUNE
    transform: MetricTransformInput
  ): DecimalValue
}

"""
Current RUNE rewards held in the bRUNE contract awaiting distribution or compounding, before protocol fees; includes a breakdown by staking mode.
"""
type BrunePendingRewards {
  """UTC measurement time shared by the pending total and mode breakdown."""
  asOf: Timestamp!
  """Total pending rewards before protocol fees, in the selected currency."""
  amount: DecimalValue
  """
  Breakdown into yielding and auto-compounding allocations before protocol fees; one row per mode. Amounts sum to the total; a measured zero total gives zero amounts and null shares.
  """
  byMode: [BrunePendingRewardModeRow!]
}

"""
Breakdown into yielding and auto-compounding allocations before protocol fees; one row per mode. Amounts sum to the total; a measured zero total gives zero amounts and null shares.
"""
type BrunePendingRewardModeRow {
  """Staking mode receiving this pending-reward allocation."""
  mode: StakingMode!
  """
  Pending rewards allocated to this mode before protocol fees, in the parent's selected currency.
  """
  amount: DecimalValue
  """
  This mode's share of total pending rewards before protocol fees; null when the total is zero or unavailable.
  """
  share: DecimalValue
}

type PositionWaterfallBreakdownRow {
  """
  REALIZED/UNREALIZED split the step's profit; PRINCIPAL/PROFIT split payouts or remaining value.
  """
  kind: PositionWaterfallBreakdownKind!
  """
  Amount in the parent step's currency and sign; known zeros remain zero.
  """
  value: DecimalValue!
}

type TokenPrice {
  """
  USD price per whole token in the representation being valued; null if unavailable.
  """
  current: DecimalValue
  """
  UTC observation time for this price, which may differ from a balance snapshot time.
  """
  asOf: Timestamp!
  """
  Price-provider or oracle identifier, when known; Ghost Credit oraclePrice identifies the on-chain oracle used for borrowing risk.
  """
  source: String
}

type TokenVariants {
  """
  Layer 1 representation, e.g. BTC.BTC or ETH.USDC-0x...; null if none exists or metadata is unavailable.
  """
  layer1: TokenRepresentation
  """
  THORChain secured representation, e.g. BTC-BTC or ETH-USDC-0x...; null if none exists or metadata is unavailable.
  """
  secured: TokenRepresentation
  """
  Native bank representation on THORChain, e.g. btc-btc or x/brune; null if none exists or metadata is unavailable.
  """
  native: TokenNativeRepresentation
}

type TokenRepresentation {
  """
  Exact identifier of this representation, as returned by the protocol; preserve its canonical form.
  """
  identifier: String!
  """
  Decimals for amounts in this representation. Layer 1 decimals can differ from secured/native bank-token decimals.
  """
  decimals: Int!
}

type TokenNativeRepresentation {
  """
  Exact THORChain bank denom for this representation, e.g. btc-btc or x/brune.
  """
  denom: String!
  """
  Decimals for atomic amounts of this bank denom; use these for atomic balance conversion.
  """
  decimals: Int!
}

type MoneyMarketGhostCredit {
  """
  Current Ghost Credit contract and shared collateral/risk settings. No historical parameter series or personal account maximum is exposed here.
  """
  current: MoneyMarketGhostCreditCurrent
}

"""
Shared Ghost Credit settings. Ignore moneyMarket tokenIds: borrowing a selected debt token still uses every eligible collateral in the Ghost Credit account.

Adjusted collateral USD = sum(collateral token amount * Ghost Credit oracle USD price * collateralRatio). Adjusted LTV = total debt oracle USD / adjusted collateral USD; this is not debt divided by unadjusted collateral value.

After borrowing or collateral changes, adjusted LTV must be strictly below adjustmentThreshold. Liquidation is permitted when adjusted LTV is at least liquidationThreshold. A zero collateralRatio contributes no borrowing power.

Example only: $100 collateral with collateralRatio 0.7 has $70 adjusted value. adjustmentThreshold 0.9 requires debt below $63; liquidationThreshold 1 reaches its threshold at $70 debt. Read current parameters instead of hardcoding these example values.
"""
type MoneyMarketGhostCreditCurrent {
  """
  Ghost Credit contract address registered as a borrower in its supported lending vaults. This is distinct from the VS borrower address.
  """
  contractAddress: Address!
  """UTC measurement time of this Ghost Credit configuration snapshot."""
  asOf: Timestamp!
  """THORChain block height of the configuration snapshot, when available."""
  blockHeight: Int
  """
  Maximum adjusted LTV after a Ghost Credit borrowing/collateral change; the resulting ratio must be strictly lower. Not a raw collateral LTV percentage.
  """
  adjustmentThreshold: DecimalValue
  """
  Adjusted LTV at or above which a Ghost Credit account can be liquidated. Compare debt with risk-adjusted collateral, not unadjusted collateral.
  """
  liquidationThreshold: DecimalValue
  """
  Complete configured Ghost Credit collateral list, independent of the selected debt token. Include configured zero-weight tokens; [] means a known empty list, null means unavailable.
  """
  collaterals: [MoneyMarketCollateral!]
}

type MoneyMarketCollateral {
  """
  Token configured as collateral in Ghost Credit; reuse its chain, variants and bank denom.
  """
  token: Token!
  """
  Ghost Credit collateral valuation weight: 0.7 counts 70% of oracle value toward adjusted collateral. Zero grants no borrowing power; null means unavailable.
  """
  collateralRatio: DecimalValue
  """
  USD per whole collateral token from the on-chain oracle used by Ghost Credit, with its observation time/source. Use for risk calculations; Token.price is a separate display price.
  """
  oraclePrice: TokenPrice
}

"""
Compute capacity in this market's native bank-token units at one balance snapshot. Ghost Credit headroom = max(borrowCap(TOKEN) - currentDebt(TOKEN), 0).

Vault liquidity = max(total supplied tokens - total outstanding debt tokens, 0); total debt includes Ghost Credit, the VS and other approved borrowers. available(TOKEN) = min(Ghost Credit headroom, vault liquidity). Use authoritative contract amounts/rounding.

Interest can push Ghost Credit debt above its configured cap; available is then zero. available is shared by all Ghost Credit users, not a wallet's collateral-based borrowing maximum. USD is a display conversion of the TOKEN result.
"""
type MoneyMarketGhostCreditState {
  """
  UTC measurement time for Ghost Credit debt, limit and vault-liquidity inputs; matches the containing market snapshot.
  """
  asOf: Timestamp!
  """THORChain block height of these balance inputs, when available."""
  blockHeight: Int
  """
  Outstanding debt borrowed through Ghost Credit in this market, including accrued interest, across all its users. Excludes the VS and other direct borrowers.
  """
  currentDebt(
    """
    USD uses the underlying token's current USD display price; TOKEN is an unscaled amount of that token, using its bank-token decimals.
    """
    unit: MoneyMarketValueUnit = USD
  ): DecimalValue
  """
  Additional borrowing currently available through Ghost Credit, limited by its own unused cap and the vault's liquid funds. Not an individual wallet's borrowing allowance.
  """
  available(
    """
    USD uses the underlying token's current USD display price; TOKEN is an unscaled amount of that token, using its bank-token decimals.
    """
    unit: MoneyMarketValueUnit = USD
  ): DecimalValue
  """
  USD per whole debt token from the on-chain oracle used by Ghost Credit for risk valuation, with observation time/source. Distinct from Token.price and capacity display-USD conversion.
  """
  oraclePrice: TokenPrice
}

"""
For utilization u in [0,1] and target t in (0,1), borrowing APR = baseRate + step1 * min(u,t) / t + step2 * max(u-t,0) / (1-t). At u=0 use baseRate; at target use baseRate+step1; at full utilization use baseRate+step1+step2. Steps are additional rates, not endpoint APRs. Hypothetical rates use market-wide supply/debt in the same token units; lending APR also applies utilization and protocolFeeRate.
"""
type MoneyMarketInterestCurve {
  """Borrowing APR at zero utilization; decimal ratio, e.g. 0.005 = 0.5%."""
  baseRate: DecimalValue
  """
  Additional borrowing APR accumulated between zero and target utilization, added to baseRate.
  """
  step1: DecimalValue
  """
  Additional borrowing APR accumulated between target and full utilization, added to baseRate and step1.
  """
  step2: DecimalValue
  """Utilization at the curve kink; strictly between zero and one."""
  targetUtilization: DecimalValue
}

"""
Lender or borrower statistics, selected by the containing branch; product-wide across all markets, with no token filter.

Map credit accounts to owners; use the borrower contract address when no owner mapping exists. Include VS/protocol actors and deduplicate addresses across markets.

Lender activity: supply/withdrawal, including receipt redemption. Borrower activity: credit-account interactions and direct borrow/repay. Successful transactions only; holding alone is not activity.

Count each transaction hash once per role, even with multiple interactions. One owner may appear in both roles; combined users deduplicate the address.

Holder counts, tiers and size distributions require the role's combined owner balance strictly above $1. No balance threshold applies to active/new users or transactions.

newUsers means first-ever interaction in this role; prior activity in the other role or another product is ignored.
"""
type MoneyMarketUserAnalytics {
  """
  Role holder counts at period close; activity and transactions during each period.
  """
  history(range: TimeRangeInput!, resolution: Resolution = DAY): [MoneyMarketUserPoint!]
  """Current role-holder count and selectable daily activity."""
  current: MoneyMarketUserCurrent
  """Role statistics over the selected range, across all markets."""
  summary(range: TimeRangeInput!): MoneyMarketUserSummary
  """
  Current owner-balance breakdown by rank tier, across all markets; only owners above $1.
  """
  tiers: [TierRow!]
  """
  Current owner-count breakdown by USD balance, across all markets; only owners above $1. Default buckets: $0–10 through $10m+.
  """
  sizeDistribution(
    """Uses the existing owner-balance USD bucket presets."""
    buckets: AmountBucketPreset = DEPOSITOR_TVL
  ): [AmountBucketRow!]
}

type MoneyMarketUserPoint {
  """
  UTC period close (last millisecond) for complete points; last included measurement time for unfinished or range-clipped points.
  """
  timestamp: Timestamp!
  """
  True only for a fully included, ended calendar period; false for unfinished or range-clipped periods. Data may still be corrected.
  """
  isComplete: Boolean!
  """
  Unique owners with combined role balances above $1 at period close, across all markets.
  """
  currentHolders(transform: MetricTransformInput): DecimalValue
  """
  Unique owners with role activity during this period; DAY gives DAU. Holding alone is not activity.
  """
  active(transform: MetricTransformInput): DecimalValue
  """
  Owners whose first-ever interaction in this role occurred during this period.
  """
  newUsers(transform: MetricTransformInput): DecimalValue
  """
  Successful transaction hashes with role activity during this period; each hash counts once per role.
  """
  transactions(transform: MetricTransformInput): DecimalValue
  """
  Share of the earlier 30-day holder cohort also holding above $1 in the recent 30-day window; no new transaction required.
  """
  retention(transform: MetricTransformInput): DecimalValue
}

type MoneyMarketUserCurrent {
  """UTC measurement time of this snapshot."""
  asOf: Timestamp!
  """
  Unique owners with combined role balances above $1 now, across all markets.
  """
  currentHolders(transform: MetricTransformInput): DecimalValue
  """
  DAY snapshot: TODAY uses latest measurement/isComplete false; LAST_COMPLETE uses the previous UTC day/isComplete true. Transforms use daily points.
  """
  activity(day: ActivityDay = TODAY): MoneyMarketUserPoint
}

type MoneyMarketUserSummary {
  """
  Role holders above $1 at the range-end cutoff; growth uses that endpoint.
  """
  currentHolders(transform: MetricTransformInput): DecimalValue
  """
  Unique owners with role activity anywhere in the selected range; not summed daily counts.
  """
  active: DecimalValue
  """
  Owners whose first-ever interaction in this role occurred during the selected range.
  """
  newUsers: DecimalValue
  """
  Distinct successful transaction hashes with role activity over the selected range.
  """
  transactions: DecimalValue
  """
  Holder retention across consecutive 30-day windows ending at the range-end cutoff; both require balances above $1.
  """
  retention(transform: MetricTransformInput): DecimalValue
}
