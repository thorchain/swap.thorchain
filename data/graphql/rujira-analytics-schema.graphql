type AmmPosition {
  "Position ID, unique within its pair."
  id: ID!

  "Trading pair containing this position."
  pair: Pair!

  "The single user who owns this position."
  owner: Account!

  "CCL or DCL; positions are individually owned, not shared pools."
  strategyType: StrategyType!

  "First deposit timestamp, displayed as Created on. Pending: AMM position projection."
  firstDepositAt: Timestamp

  "Investment age weighted by the size and timing of deposits and withdrawals; not simply time since creation. Unit: days. Pending: AMM position projection."
  weightedAverageAgeDays: DecimalValue

  "Current price bounds: configured for CCL, dynamically adjusted for DCL. Pending: AMM position projection."
  range: AmmPositionRange

  """
  Total principal deposited over this position's lifetime, in the selected currency.
  """
  totalInvested(
    """
    QUOTE_TOKEN uses the pair's quote token. USD converts quote value at the current quote-to-USD exchange rate.
    """
    currency: PositionValueCurrency = QUOTE_TOKEN
  ): DecimalValue

  """
  Lifetime principal withdrawn, as a positive amount; excludes realized compounded profit and claimable-profit payouts.
  """
  withdrawn(
    """
    QUOTE_TOKEN uses the pair's quote token. USD converts quote value at the current quote-to-USD exchange rate.
    """
    currency: PositionValueCurrency = QUOTE_TOKEN
  ): DecimalValue

  """
  Lifetime realized yield after protocol fees: claimable-profit payouts plus compounded profit realized through inventory withdrawals.
  """
  claimedYield(
    """
    QUOTE_TOKEN uses the pair's quote token. USD converts quote value at the current quote-to-USD exchange rate.
    """
    currency: PositionValueCurrency = QUOTE_TOKEN
  ): DecimalValue

  "Current value of remaining principal, excluding unclaimed yield. Pending: AMM position projection."
  currentValue(
    "QUOTE_TOKEN uses the pair's quote token. USD converts quote value at the current quote-to-USD exchange rate."
    currency: PositionValueCurrency
  ): DecimalValue

  """
  Current claimable profit plus remaining net compounded profit, after protocol fees. The compounded portion is not separately claimable.
  """
  unclaimedYield(
    """
    QUOTE_TOKEN uses the pair's quote token. USD converts quote value at the current quote-to-USD exchange rate.
    """
    currency: PositionValueCurrency = QUOTE_TOKEN
  ): DecimalValue

  "Current principal value, excluding unclaimed yield, converted at the current quote-to-USD rate; matches currentValue(currency: USD). Unit: usd. Pending: AMM position projection."
  currentValueUsd: DecimalValue

  "MOIC: total realized and unrealized value relative to invested capital over the position's lifetime; displayed as a multiple. Unit: ratio. Pending: AMM position projection."
  moneyMultiple: DecimalValue

  "Principal withdrawals plus claimed yield relative to invested capital over the position's lifetime; displayed as a multiple. Unit: ratio. Pending: AMM position projection."
  dpi: DecimalValue

  "Individual all-time annualized claimable-yield return since inception; excludes principal price gains\/losses. Currently null for fully compounding positions. No period selector. Unit: ratio. Pending: AMM position projection."
  apr: DecimalValue

  "Current CCL range status; null for DCL because its range is dynamic. Pending: AMM position projection."
  inRange: Boolean

  """
  Nine ordered lifetime steps from inception to the current snapshot, in the selected currency; no date-range selector.
  """
  waterfall(
    """
    QUOTE_TOKEN uses the pair's quote token. USD converts quote value at the current quote-to-USD exchange rate.
    """
    currency: PositionValueCurrency = QUOTE_TOKEN
  ): [PositionWaterfallStep!]

  "UTC measurement time of this position snapshot; matches the containing positions table when returned in a list."
  asOf: Timestamp!

  """
  OPEN has positive remaining principal/yield; CLOSED is fully exited with zero remaining value and retained lifetime metrics.
  """
  status: PositionStatus!

  """
  Current principal value, including inventory price gains/losses; excludes claimable profit and remaining net compounded profit.
  """
  principalValue(
    """
    QUOTE_TOKEN uses the pair's quote token. USD converts quote value at the current quote-to-USD exchange rate.
    """
    currency: PositionValueCurrency = QUOTE_TOKEN
  ): DecimalValue

  """
  Current principal value, excluding unclaimed yield, converted at the current quote-to-USD rate; matches principalValue(currency: USD).
  """
  principalValueUsd: DecimalValue

  """
  Lifetime executed trades involving this position, buys and sells; count each execution once, merging internal slices. A transaction can contain several trades.
  """
  trades: DecimalValue

  """
  Lifetime trades divided by weightedAverageAgeDays, without rounding or a one-day floor; null if inputs are unavailable or age is nonpositive.
  """
  averageTradesPerDay: DecimalValue

  """
  Lifetime executed quote-token notional before fees, buys plus sells; count this position's participation once, with no 50% adjustment.
  """
  volume(
    """
    QUOTE_TOKEN uses the pair's quote token. USD converts quote value at the current quote-to-USD exchange rate.
    """
    currency: PositionValueCurrency = QUOTE_TOKEN
  ): DecimalValue

  """
  Lifetime volume divided by weightedAverageAgeDays, in the selected currency per day, without rounding or a one-day floor; null if inputs are unavailable or age is nonpositive.
  """
  averageVolumePerDay(
    """
    QUOTE_TOKEN uses the pair's quote token. USD converts quote value at the current quote-to-USD exchange rate.
    """
    currency: PositionValueCurrency = QUOTE_TOKEN
  ): DecimalValue
}

