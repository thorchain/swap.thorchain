"""
Lending/borrowing financial metrics for the selected markets; users are product-wide under analytics.users. Monetary values are USD, except borrowCap(unit: TOKEN). No selected markets: amounts are zero, APRs null, breakdowns and market rows empty.
"""
type MoneyMarketAnalytics {
  """
  Latest selected-token balances, current rates and queryable historical rate averages.
  """
  current: MoneyMarketCurrent
  """
  Selected-token balances and rates at period close; interest/revenue during each period.
  """
  history(
    range: TimeRangeInput!
    """Period each point covers: DAY, WEEK, MONTH or YEAR; defaults to DAY."""
    resolution: Resolution = DAY
  ): [MoneyMarketPoint!]
  """
  Market rows matching tokenIds and optional Ghost Credit approval filter; apply filters before sorting/pagination. No matches returns no rows. Financial totals retain their separate token scope.
  """
  markets(
    """Positive page size; use 5 for the top five lending markets."""
    first: Int = 25
    """
    Cursor for the same token selection, ghostCreditSupported filter and sorting.
    """
    after: String
    """
    Omitted/null selects all markets. True selects vaults where Ghost Credit is registered as an approved borrower; false selects known non-approved vaults, including VS-only markets. Approval remains true with zero limit/debt/available amount. Unknown approval is excluded from either explicit filter.
    """
    ghostCreditSupported: Boolean
    """
    Default token symbol ascending; LENDING_APR/DESC ranks current rates unless averageOver is supplied.
    """
    orderBy: MoneyMarketOrderInput = {field: TOKEN, direction: ASC}
  ): MoneyMarketTable
  """
  Distributed-revenue USD/share breakdown by underlying token over the selected range; descending by value; inherits token selection.
  """
  revenueByToken(
    """
    Omitted/null selects the last 30 days; custom dates and allTime are supported.
    """
    range: TimeRangeInput = {trailing: {value: 30, unit: DAY}}
    recipient: MoneyMarketRevenueRecipient = TOTAL
  ): [TokenBreakdownRow!]
  """
  Interest accrued and revenue distributed over the selected range; raw totals, independent of smoothing.
  """
  summary(range: TimeRangeInput!): MoneyMarketSummary
  """
  Current USD balance/share breakdown by underlying token, descending by value; inherits token selection. Unit: usd.
  """
  tvlByToken(side: MoneyMarketSide!): [TokenBreakdownRow!]

  """
  Shared current settings for Ghost Credit borrowing. Its collateral rules apply across Ghost Credit debt markets and are independent of tokenIds and the market-list filter.
  """
  ghostCredit: MoneyMarketGhostCredit
}

"""Latest Money Market snapshot for the selected markets."""
type MoneyMarketCurrent {
  """
  Current selected-side APR weighted by that side's USD balances; averageOver averages these historical daily rates. Null when no eligible rate is available.
  """
  apr(
    side: MoneyMarketSide!
    """
    Omitted/null = current rate; otherwise a historical daily rate average. Supports 1d, 7d, 30d and allTime; see rateAverages.
    """
    averageOver: TimeRangeInput
  ): DecimalValue
  """UTC measurement time of this snapshot."""
  asOf: Timestamp!
  """Selected-side USD balance at asOf. Unit: usd."""
  tvl(side: MoneyMarketSide!): DecimalValue
}

enum MoneyMarketSide {
  """
  Lender balances include lent funds and accrued lender interest; APR is after protocol fees.
  """
  LENDING
  """
  Outstanding debt includes accrued interest and all approved borrowers: Ghost Credit, the VS and others. APR is a positive interest cost.
  """
  BORROWING
}

"""One chart period of the selected Money Market markets."""
type MoneyMarketPoint {
  """
  Selected-side annualized rate at period close, weighted by that side's USD balances; SMA smooths these point values. Unit: ratio.
  """
  apr(
    side: MoneyMarketSide!
    """Declared: SMA, GROWTH."""
    transform: MetricTransformInput
  ): DecimalValue
  """
  Interest accrued during this period, by allocation; TOTAL includes lender and protocol shares. Unit: usd.
  """
  interest(
    allocation: MoneyMarketInterestAllocation = TOTAL
    """Declared: SMA, GROWTH."""
    transform: MetricTransformInput
  ): DecimalValue
  """
  True only for a fully included, ended calendar period; false for unfinished or range-clipped periods. Data may still be corrected.
  """
  isComplete: Boolean!
  """
  Receipt-distribution revenue during this period; TOTAL = RUJIRA + THORCHAIN. Unit: usd.
  """
  revenue(
    recipient: MoneyMarketRevenueRecipient = TOTAL
    """Declared: SMA, GROWTH."""
    transform: MetricTransformInput
  ): DecimalValue
  """
  UTC period close (last millisecond) for complete points; last included measurement time for unfinished or range-clipped points.
  """
  timestamp: Timestamp!
  """
  Selected-side USD balance at period close; latest included balance if unfinished. Unit: usd.
  """
  tvl(
    side: MoneyMarketSide!
    """Declared: SMA, GROWTH."""
    transform: MetricTransformInput
  ): DecimalValue
}

"""
Accrued interest allocation: TOTAL = LENDERS + PROTOCOL. Current split: lenders 90%, protocol 10%; follow the applicable fee configuration.
"""
enum MoneyMarketInterestAllocation {
  TOTAL
  LENDERS
  PROTOCOL
}

"""
Protocol receipt distributions: TOTAL = RUJIRA + THORCHAIN. Recognition is at receipt distribution, not interest accrual or converter cash payout.
"""
enum MoneyMarketRevenueRecipient {
  TOTAL
  RUJIRA
  THORCHAIN
}

"""
Balances/cap sort in current USD. APR sorts use current rates or averageOver; range applies only to REVENUE. Missing values last; market ID breaks ties.
