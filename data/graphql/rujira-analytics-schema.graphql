    "Select RUJI, BRUNE or TCY; all shared staking metrics and users refer to this token."
    token: StakingToken!
  ): StakingAnalytics

  """
  Swap/Trade/AMM/Money Market users; omitted products selects all four. Staking is separate.

  products: omitted/null = all four; [] = none; duplicates ignored.

  Count each address once across selected products/roles.

  Activity: Swap/Trade use; AMM positive deposits at any time in the interval; Money Market lending/credit interactions or direct borrow/repay. Holding alone is not Money Market activity.

  newUsers = first use in the selected product set.

