  kind: TransformKind!

  "Trailing mean of 1–365 output bins, including this bin."
  periods: Int

  "Duration covering a whole number of output bins, at most 365. Mutually exclusive with periods."
  window: DurationInput

  "Required by GROWTH, rejected otherwise. ABSOLUTE keeps the field's unit; RELATIVE is a scale-free ratio."
