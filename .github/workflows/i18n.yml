name: Translate UI strings

# Whenever the English source (en.json) changes on main, translate the new or
# modified strings into every other locale and commit the result back.
# Requires an ANTHROPIC_API_KEY repository secret.

on:
  push:
    branches: [main]
    paths:
      - 'src/i18n/messages/en.json'
  workflow_dispatch: {}

# Avoid overlapping runs racing to commit translations.
concurrency:
  group: i18n-translate
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Translate changed strings
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run i18n:translate

      - name: Commit translations
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No translation changes."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/i18n/messages tools/i18n-en-snapshot.json
          git commit -m "Auto-translate updated UI strings [skip ci]"
          git push
